name: CD

on:
  push:
    branches: [growpal]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy on VPS
    runs-on: self-hosted
    environment: growpal
    # Runner user thường không có $HOME ghi được → BuildKit/buildx lỗi "permission denied"
    env:
      HOME: ${{ github.workspace }}/.ci-home
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-config
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner dirs
        run: |
          mkdir -p "$HOME" "$DOCKER_CONFIG" "$XDG_CACHE_HOME"
          echo "HOME=$HOME"
          docker version
          docker compose version

      - name: Render .env.docker
        env:
          API_GATEWAY_PORT: ${{ secrets.API_GATEWAY_PORT }}
          IDENTITY_SERVICE_PORT: ${{ secrets.IDENTITY_SERVICE_PORT }}
          ECOMMERCE_SERVICE_PORT: ${{ secrets.ECOMMERCE_SERVICE_PORT }}
          BALCONY_SERVICE_PORT: ${{ secrets.BALCONY_SERVICE_PORT }}
          IOT_ENGINE_SERVICE_PORT: ${{ secrets.IOT_ENGINE_SERVICE_PORT }}
          IDENTITY_SERVICE_HOST: ${{ secrets.IDENTITY_SERVICE_HOST }}
          ECOMMERCE_SERVICE_HOST: ${{ secrets.ECOMMERCE_SERVICE_HOST }}
          BALCONY_SERVICE_HOST: ${{ secrets.BALCONY_SERVICE_HOST }}
          IOT_ENGINE_SERVICE_HOST: ${{ secrets.IOT_ENGINE_SERVICE_HOST }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_PORT: ${{ secrets.RABBITMQ_PORT }}
          RABBITMQ_VHOST: ${{ secrets.RABBITMQ_VHOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MQTT_BROKER_URL: ${{ secrets.MQTT_BROKER_URL }}
          MQTT_BROKER_USERNAME: ${{ secrets.MQTT_BROKER_USERNAME }}
          MQTT_BROKER_PASSWORD: ${{ secrets.MQTT_BROKER_PASSWORD }}
          JWT_ACCESS_TOKEN_SECRET: ${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
          JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
          JWT_ACCESS_TOKEN_EXPIRATION: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION }}
          JWT_REFRESH_TOKEN_EXPIRATION: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DEFAULT_USER_ROLE: ${{ secrets.DEFAULT_USER_ROLE }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          AI_PLATFORM_URL: ${{ secrets.AI_PLATFORM_URL }}
          AI_PLATFORM_KEY: ${{ secrets.AI_PLATFORM_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          set -eu
          {
            echo "# Generated by CD workflow — do not commit"
            echo ""
            echo "API_GATEWAY_PORT=${API_GATEWAY_PORT:-4000}"
            echo "IDENTITY_SERVICE_PORT=${IDENTITY_SERVICE_PORT:-4002}"
            echo "ECOMMERCE_SERVICE_PORT=${ECOMMERCE_SERVICE_PORT:-4003}"
            echo "BALCONY_SERVICE_PORT=${BALCONY_SERVICE_PORT:-4001}"
            echo "IOT_ENGINE_SERVICE_PORT=${IOT_ENGINE_SERVICE_PORT:-4004}"
            echo ""
            echo "IDENTITY_SERVICE_HOST=${IDENTITY_SERVICE_HOST:-identity-service}"
            echo "ECOMMERCE_SERVICE_HOST=${ECOMMERCE_SERVICE_HOST:-ecommerce-service}"
            echo "BALCONY_SERVICE_HOST=${BALCONY_SERVICE_HOST:-balcony-service}"
            echo "IOT_ENGINE_SERVICE_HOST=${IOT_ENGINE_SERVICE_HOST:-iot-engine-service}"
            echo ""
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "REDIS_URL=${REDIS_URL}"
            echo "MONGODB_URI=${MONGODB_URI}"
            echo ""
            echo "RABBITMQ_USER=${RABBITMQ_USER}"
            echo "RABBITMQ_PASS=${RABBITMQ_PASS}"
            echo "RABBITMQ_HOST=${RABBITMQ_HOST}"
            echo "RABBITMQ_PORT=${RABBITMQ_PORT:-5672}"
            echo "RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}"
            echo ""
            echo "MQTT_BROKER_URL=${MQTT_BROKER_URL}"
            echo "MQTT_BROKER_USERNAME=${MQTT_BROKER_USERNAME}"
            echo "MQTT_BROKER_PASSWORD=${MQTT_BROKER_PASSWORD}"
            echo ""
            echo "JWT_ACCESS_TOKEN_SECRET=${JWT_ACCESS_TOKEN_SECRET}"
            echo "JWT_REFRESH_TOKEN_SECRET=${JWT_REFRESH_TOKEN_SECRET}"
            echo "JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION:-900000}"
            echo "JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}"
            echo ""
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
            echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}"
            echo "GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}"
            echo "FRONTEND_URL=${FRONTEND_URL}"
            echo "DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-CUSTOMER}"
            echo ""
            echo "PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID}"
            echo "PAYOS_API_KEY=${PAYOS_API_KEY}"
            echo "PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY}"
            echo ""
            echo "AI_PLATFORM_URL=${AI_PLATFORM_URL}"
            echo "AI_PLATFORM_KEY=${AI_PLATFORM_KEY}"
            echo "GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}"
            echo "CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}"
            echo "CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}"
          } > .env.docker
          echo ".env.docker generated ($(wc -l < .env.docker) lines)"
          if [ "${API_GATEWAY_PORT:-4000}" = "3000" ]; then
            echo "::warning::API_GATEWAY_PORT=3000 — có thể conflict với orchidpal-web, nên dùng 4000"
          fi
          missing=""
          for key in JWT_ACCESS_TOKEN_SECRET JWT_REFRESH_TOKEN_SECRET REDIS_URL RABBITMQ_HOST DATABASE_URL; do
            eval "val=\${$key:-}"
            [ -z "$val" ] && missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Thiếu secrets:$missing"
          fi

      - name: Docker build
        run: docker build -t growpal-be:latest .

      - name: Stop old stack (free ports)
        run: docker compose --env-file .env.docker down --remove-orphans || true

      - name: Docker up
        run: docker compose --env-file .env.docker up -d --no-build --remove-orphans

      - name: Prune dangling images
        run: docker image prune -f

      - name: Show status
        run: |
          docker compose --env-file .env.docker ps
          for svc in api-gateway ecommerce-service iot-engine-service migrate; do
            echo "===== logs: $svc ====="
            docker compose --env-file .env.docker logs --tail=40 "$svc" || true
          done

# Backend only — Postgres, Redis, RabbitMQ, MongoDB, MQTT chạy ngoài Docker (cấu hình qua .env.docker)

name: growpal

x-app-common: &app-common
  image: growpal-be:latest
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env.docker
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - orchid-network

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # Database migration (one-shot, dùng DATABASE_URL từ .env.docker)
  # ═══════════════════════════════════════════════════════════════════════════

  migrate:
    <<: *app-common
    container_name: growpal-migrate
    restart: "no"
    command:
      - npx
      - prisma
      - migrate
      - deploy
      - --schema=./libs/prisma/prisma/schema.prisma

  # ═══════════════════════════════════════════════════════════════════════════
  # Microservices (gRPC; RabbitMQ/MQTT/DB qua env)
  # ═══════════════════════════════════════════════════════════════════════════

  identity-service:
    <<: *app-common
    container_name: growpal-identity
    command: ["node", "dist/apps/identity-service/main.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "${IDENTITY_SERVICE_PORT:-3001}"

  ecommerce-service:
    <<: *app-common
    container_name: growpal-ecommerce
    command: ["node", "dist/apps/ecommerce-service/main.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "${ECOMMERCE_SERVICE_PORT:-3002}"

  balcony-service:
    <<: *app-common
    container_name: growpal-balcony
    command: ["node", "dist/apps/balcony-service/main.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "${BALCONY_SERVICE_PORT:-3003}"

  iot-engine-service:
    <<: *app-common
    container_name: growpal-iot-engine
    command: ["node", "dist/apps/iot-engine-service/main.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "${IOT_ENGINE_SERVICE_PORT:-3004}"

  # ═══════════════════════════════════════════════════════════════════════════
  # API Gateway (HTTP + Swagger)
  # ═══════════════════════════════════════════════════════════════════════════

  api-gateway:
    <<: *app-common
    container_name: growpal-api-gateway
    command: ["node", "dist/apps/api-gateway/main.js"]
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    depends_on:
      identity-service:
        condition: service_started
      ecommerce-service:
        condition: service_started
      balcony-service:
        condition: service_started
      iot-engine-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/docs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  orchid-network:
    driver: bridge
